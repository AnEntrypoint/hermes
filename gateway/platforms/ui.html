<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hermes</title>
<script type="importmap">
{"imports":{"webjsx":"https://cdn.jsdelivr.net/npm/webjsx@0.0.73/dist/index.js","webjsx/jsx-runtime":"https://cdn.jsdelivr.net/npm/webjsx@0.0.73/dist/jsx-runtime.js"}}
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/rippleui@1.12.1/dist/css/styles.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
#log{height:calc(100vh - 140px);overflow-y:auto}
.msg-user{justify-content:flex-end}
.msg-assistant{justify-content:flex-start}
</style>
</head>
<body class="bg-base-2 flex flex-col h-screen p-4 max-w-2xl mx-auto">
<h1 class="text-xl font-bold mb-2">Hermes</h1>
<div id="log" class="flex flex-col gap-2 mb-2"></div>
<form id="frm" class="flex gap-2">
<input id="inp" class="input input-bordered flex-1" placeholder="Message…" autocomplete="off">
<button class="btn btn-primary" type="submit">Send</button>
</form>
<script type="module">
import { createElement, applyDiff } from "webjsx";
window.__debug = {};
const log = document.getElementById("log");
const inp = document.getElementById("inp");
const frm = document.getElementById("frm");
const msgs = [];
const token = new URLSearchParams(location.search).get("token") || localStorage.getItem("token") || "";
window.__debug.msgs = msgs;

function render() {
  applyDiff(log, msgs.map(m =>
    createElement("div", { class: "flex " + (m.role === "user" ? "msg-user" : "msg-assistant") },
      createElement("div", { class: "chat-bubble " + (m.role === "user" ? "chat-bubble-primary" : "chat-bubble-secondary") },
        m.content
      )
    )
  ));
  log.scrollTop = log.scrollHeight;
}

frm.addEventListener("submit", async e => {
  e.preventDefault();
  const text = inp.value.trim();
  if (!text) return;
  inp.value = "";
  msgs.push({ role: "user", content: text });
  render();
  const headers = { "Content-Type": "application/json" };
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch("/v1/chat/completions", {
    method: "POST",
    headers,
    body: JSON.stringify({ model: "hermes-agent", messages: msgs })
  });
  if (!res.ok) { msgs.push({ role: "assistant", content: "Error: " + res.status }); render(); return; }
  const data = await res.json();
  const reply = data.choices?.[0]?.message?.content ?? "";
  msgs.push({ role: "assistant", content: reply });
  render();
});
</script>
</body>
</html>
